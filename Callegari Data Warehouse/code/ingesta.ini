; Frecuencia de extracción, no afirmación sobre la frecuencia de cambios del ERP.
[ingesta]
directorio = ../.ingesta
lote_filas = 25000
timeout_seg = 900
; Corte de extracción para hechos; los maestros se conservan completos.
fecha_desde = 2018-01-01
ventana_meses = 5
solape_cambios_horas = 48

