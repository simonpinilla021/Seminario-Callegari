; Copiar este archivo como config.ini y ajustar la conexión.
; Contraseña: python -B -m administracion.configurar_credenciales --perfil dw (cifrado Windows),
; o definir PGPASSWORD. Si no hay credencial, se pregunta al ejecutar.

[postgres]
host = localhost
port = 5432
dbname = dw_callegari
user = postgres
; Opcional: quitar el ; y escribir la contraseña (config.ini no se sube a Git)
; password = 

[fuentes]
; rutas relativas a la carpeta MVP Data Warehouse
erp = ../src/erp_actual
combustible = ../src/combustible_historico
; contabilidad: carpeta con rv_fact_acct.parquet (asientos contables, todas las empresas del grupo)
contabilidad = ../src/contabilidad
; tablas: tablas completas del ERP (no vistas), extraídas con EDA\scripts\extraer_tablas.py (la usa taller: sit_workorder)
tablas = ../src/tablas
